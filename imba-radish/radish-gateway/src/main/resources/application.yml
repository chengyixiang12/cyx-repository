server:
  port: 8080
  tomcat:
    connection-timeout: 60000
    keep-alive-timeout: 30000

spring:
  application:
    name: radish-gateway
  threads:
    virtual:
      enabled: true

  # 从 Nacos 配置中心加载动态配置；dataId 不存在时不影响启动
  # （SCA 2025.x 已废弃 bootstrap.yml，必须使用 spring.config.import）
  config:
    import: optional:nacos:radish-gateway.yaml

  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:192.168.226.130:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        # Nacos 不可达时不阻断服务启动，只记录注册失败
        fail-fast: ${NACOS_FAIL_FAST:false}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:192.168.226.130:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

    gateway:
      server:
        # 注意前缀：Spring Cloud 2025.x 起为 spring.cloud.gateway.server.webmvc.*
        # （旧前缀 spring.cloud.gateway.mvc.* 已废弃）
        webmvc:
          # lb:// 表示通过 Nacos 服务发现 + 客户端负载均衡，不写死实例地址
          routes:
            - id: radish-system
              uri: lb://radish-system
              predicates:
                - Path=/sys/**
            - id: radish-business
              uri: lb://radish-business
              predicates:
                - Path=/biz/**

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: always

radish:
  cors:
    # 生产环境建议改成具体域名，多个用逗号分隔
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    root: info
